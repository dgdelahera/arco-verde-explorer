server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;

    # add_header is not inherited by locations that define their own, so each one includes the shared headers.
    location /data/ {
        types { application/geo+json geojson; application/json json; }
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }

    # No client-side routes (deep links use #hash): / serves index.html, unknown paths 404.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
